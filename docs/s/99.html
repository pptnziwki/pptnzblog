<p><a href="http://peppertones.host.whoisweb.net/blog/99">원문으로 이동</a></p>
<script>
(function () {
  var appUrl = "pptnzblog://post/99";
  var fallbackUrl = "http://peppertones.host.whoisweb.net/blog/99";
  var redirected = false;

  function goFallback() {
    if (redirected || document.hidden) return;
    redirected = true;
    window.location.href = fallbackUrl;
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) redirected = true;
  });

  window.location.href = appUrl;
  setTimeout(goFallback, 1200);
})();
</script>
