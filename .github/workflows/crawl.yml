name: PPTNZ 블로그 체크

on:
  schedule:
    - cron: '*/20 * * * *'   # 20분마다 실행 (GitHub 특성상 실제로는 다소 지연될 수 있음)
  workflow_dispatch:          # 수동 실행 버튼도 열어둠

permissions:
  contents: write   # posts.json을 커밋/푸시하려면 쓰기 권한이 필요

# 뉴스 워크플로(crawl_news.yml)와 동시에 main에 푸시하다 충돌하지 않도록 한 번에 하나씩만 실행
concurrency:
  group: pptnz-crawl-commit
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests beautifulsoup4

      - run: python crawl_pptnz_blog.py

      - run: python generate_share_pages.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json docs/
          git diff --staged --quiet || git commit -m "update posts.json"
          # 60일간 커밋이 없으면 GitHub이 스케줄 워크플로를 자동 비활성화하므로,
          # 마지막 커밋이 45일 넘었으면 빈 커밋으로 활성 상태 유지
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $((NOW - LAST)) -gt $((45*24*3600)) ]; then
            git commit --allow-empty -m "keepalive: 스케줄 워크플로 비활성화 방지"
          fi
          git push
