name: PPTNZBlog
options:
  bundleIdPrefix: com.wooyxxng
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0

targets:
  PPTNZBlog:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Sources/Resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: pptnz.net
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.wooyxxng.pptnzblog.refresh
        NSAppTransportSecurity:
          NSExceptionDomains:
            peppertones.host.whoisweb.net:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - pptnzblog
        LSApplicationQueriesSchemes:
          - instagram-stories
    entitlements:
      path: Sources/App/PPTNZBlog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wooyxxng.pptnzblog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wooyxxng.pptnzblog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PPTNZBlogWidgetExtension
        embed: true
      - package: SwiftSoup

  PPTNZBlogWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: PPTNZ 위젯
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/Widget/PPTNZBlogWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wooyxxng.pptnzblog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wooyxxng.pptnzblog.widget
        SKIP_INSTALL: YES
