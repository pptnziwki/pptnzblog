name: PPTNZBlog
options:
  bundleIdPrefix: com.wooyxxng
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  PPTNZBlog:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Sources/App/Info.plist
    entitlements:
      path: Sources/App/PPTNZBlog.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wooyxxng.pptnzblog
    dependencies:
      - target: PPTNZBlogWidgetExtension
        embed: true

  PPTNZBlogWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Sources/Widget/Info.plist
    entitlements:
      path: Sources/Widget/PPTNZBlogWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wooyxxng.pptnzblog.widget
        SKIP_INSTALL: YES
